version: "3.9"
services:
  db:
    image: postgres:16-alpine
    container_name: hrcrm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hrcrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hrcrm_secret_pass_2024}
      POSTGRES_DB: ${POSTGRES_DB:-hrcrm}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hrcrm} -d ${POSTGRES_DB:-hrcrm}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hrcrm-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-hrcrm}:${POSTGRES_PASSWORD:-hrcrm_secret_pass_2024}@db:5432/${POSTGRES_DB:-hrcrm}}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production-abcdef123456}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-43200}
      TZ: ${TZ:-Asia/Dhaka}
    volumes:
      - uploads:/app/uploads
      - backups:/app/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 25s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: hrcrm-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  db-data:
  uploads:
  backups: